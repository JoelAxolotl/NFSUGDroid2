plugins {
    id "com.android.application"
}

android {
    namespace "com.rea.nfsug2"
    compileSdk 34
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.rea.nfsug2"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            // The device (and every modern phone) is arm64-only; the guest's
            // 32-bit address space is hosted inside a 64-bit reservation.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo" } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}
